plugins {
    id 'com.android.application'
}

android {
    namespace 'com.boihpihing.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.boihpihing.app'
        minSdk 24
        targetSdk 36
        versionCode 39
        versionName '3.9'
        // 기상청 단기예보 인증키: GitHub 비밀값 KMA_API_KEY에서 빌드 때 넣는다(저장소에는 넣지 않음)
        buildConfigField 'String', 'KMA_KEY', '"' + (System.getenv('KMA_API_KEY') ?: '') + '"'
    }

    signingConfigs {
        upload {
            // 스토어 업로드 키: GitHub Actions 비밀값(UPLOAD_KEYSTORE_B64, UPLOAD_KEYSTORE_PASSWORD)으로 만든 파일을 쓴다
            storeFile file(System.getenv('UPLOAD_KEYSTORE_FILE') ?: 'upload.jks')
            storePassword System.getenv('UPLOAD_KEYSTORE_PASSWORD') ?: ''
            keyAlias 'upload'
            keyPassword System.getenv('UPLOAD_KEYSTORE_PASSWORD') ?: ''
        }
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    flavorDimensions 'style'
    productFlavors {
        classic {
            dimension 'style'
            resValue 'string', 'app_name', '보이흐피힝'
        }
        dot {
            dimension 'style'
            applicationIdSuffix '.dot'
            resValue 'string', 'app_name', '보이흐피힝 도트'
        }
        // 구글 플레이 스토어용: 도트 버전과 같은 게임 파일, 별도 패키지 이름
        store {
            dimension 'style'
            applicationId 'com.boihpihing.fishing'
            resValue 'string', 'app_name', '보이흐피힝'
            // AdMob ID. 지금은 구글이 제공하는 테스트 ID — 정식 출시 전에 내 AdMob 계정의 ID로 바꾼다
            manifestPlaceholders = [admobAppId: 'ca-app-pub-3940256099942544~3347511713']
            buildConfigField 'String', 'AD_BANNER', '"ca-app-pub-3940256099942544/9214589741"'
            buildConfigField 'String', 'AD_REWARDED', '"ca-app-pub-3940256099942544/5224354917"'
        }
    }

    sourceSets {
        store {
            assets.srcDirs = ['src/dot/assets']
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.upload
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.13.1'
    // 광고(스토어 빌드만): Google Mobile Ads SDK + 동의 관리(UMP)
    storeImplementation 'com.google.android.gms:play-services-ads:25.4.0'
    storeImplementation 'com.google.android.ump:user-messaging-platform:3.2.0'
}
