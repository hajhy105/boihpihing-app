plugins {
    id 'com.android.application'
}

android {
    namespace 'com.boihpihing.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.boihpihing.app'
        minSdk 24
        targetSdk 36
        versionCode 26
        versionName '2.6'
    }

    signingConfigs {
        upload {
            // 스토어 업로드 키: GitHub Actions 비밀값(UPLOAD_KEYSTORE_B64, UPLOAD_KEYSTORE_PASSWORD)으로 만든 파일을 쓴다
            storeFile file(System.getenv('UPLOAD_KEYSTORE_FILE') ?: 'upload.jks')
            storePassword System.getenv('UPLOAD_KEYSTORE_PASSWORD') ?: ''
            keyAlias 'upload'
            keyPassword System.getenv('UPLOAD_KEYSTORE_PASSWORD') ?: ''
        }
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    flavorDimensions 'style'
    productFlavors {
        classic {
            dimension 'style'
            resValue 'string', 'app_name', '보이흐피힝'
        }
        dot {
            dimension 'style'
            applicationIdSuffix '.dot'
            resValue 'string', 'app_name', '보이흐피힝 도트'
        }
        // 구글 플레이 스토어용: 도트 버전과 같은 게임 파일, 별도 패키지 이름
        store {
            dimension 'style'
            applicationId 'com.boihpihing.fishing'
            resValue 'string', 'app_name', '보이흐피힝'
        }
    }

    sourceSets {
        store {
            assets.srcDirs = ['src/dot/assets']
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.upload
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.13.1'
}
