plugins {
    id 'com.android.application'
}

android {
    namespace 'com.boihpihing.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.boihpihing.app'
        minSdk 24
        targetSdk 35
        versionCode 24
        versionName '2.4'
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    flavorDimensions 'style'
    productFlavors {
        classic {
            dimension 'style'
            resValue 'string', 'app_name', '보이흐피힝'
        }
        dot {
            dimension 'style'
            applicationIdSuffix '.dot'
            resValue 'string', 'app_name', '보이흐피힝 도트'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.13.1'
}
