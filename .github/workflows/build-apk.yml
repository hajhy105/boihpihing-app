name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # 앱 안에 한글 글꼴(Jua, Gowun Dodum)을 넣어서 인터넷 없이도 같은 글꼴로 보이게 한다
      - name: Bundle fonts into the dot game
        run: |
          mkdir -p app/src/dot/assets/fonts
          curl -fsSL -o app/src/dot/assets/fonts/Jua-Regular.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/jua/Jua-Regular.ttf || echo "글꼴 내려받기 실패"
          curl -fsSL -o app/src/dot/assets/fonts/GowunDodum-Regular.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/gowundodum/GowunDodum-Regular.ttf || echo "글꼴 내려받기 실패"
          curl -fsSL -o app/src/dot/assets/fonts/OFL.txt https://raw.githubusercontent.com/google/fonts/main/ofl/jua/OFL.txt || echo "글꼴 내려받기 실패"
          python3 - <<'PY'
          p='app/src/dot/assets/index.html'
          s=open(p,encoding='utf-8').read()
          import re
          s=re.sub(r'<link rel="preconnect"[^>]*>\s*','',s)
          s=re.sub(r'<link href="https://fonts.googleapis.com[^>]*>','<style>@font-face{font-family:Jua;src:url(fonts/Jua-Regular.ttf)}@font-face{font-family:"Gowun Dodum";src:url(fonts/GowunDodum-Regular.ttf)}</style>',s)
          open(p,'w',encoding='utf-8').write(s)
          PY

      - name: Build debug APK
        env:
          KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
        run: gradle assembleClassicDebug assembleDotDebug assembleStoreDebug --no-daemon

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/classic/debug/app-classic-debug.apk boihpihing-${{ github.run_number }}.apk
          cp app/build/outputs/apk/dot/debug/app-dot-debug.apk boihpihing-dot-${{ github.run_number }}.apk
          cp app/build/outputs/apk/store/debug/app-store-debug.apk boihpihing-store-test-${{ github.run_number }}.apk

      # 구글 플레이 업로드용 AAB. 업로드 키 비밀값이 등록돼 있을 때만 만든다
      - name: Build signed store AAB
        env:
          KS_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
        run: |
          if [ -z "$KS_B64" ]; then echo "업로드 키 비밀값이 없어서 AAB는 건너뜀"; exit 0; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export UPLOAD_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          gradle bundleStoreRelease --no-daemon
          cp app/build/outputs/bundle/storeRelease/app-store-release.aab boihpihing-store-${{ github.run_number }}.aab
          rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: boihpihing-apk
          path: |
            boihpihing-${{ github.run_number }}.apk
            boihpihing-dot-${{ github.run_number }}.apk
            boihpihing-store-${{ github.run_number }}.aab
            boihpihing-store-test-${{ github.run_number }}.apk
          if-no-files-found: warn

      - name: Publish release (direct download link for phones)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 보이흐피힝 빌드 ${{ github.run_number }}
          body: |
            boihpihing-N.apk = 3D 버전, boihpihing-dot-N.apk = 도트 버전 (둘은 따로 설치돼요)
            boihpihing-store-N.aab = 구글 플레이 업로드용 (휴대폰에 직접 설치하는 파일이 아니에요)
            boihpihing-store-test-N.apk = 스토어 버전 광고 테스트용 (테스트 광고가 나와요. 플레이 스토어 버전을 설치하기 전에 지워야 해요)
          files: |
            boihpihing-${{ github.run_number }}.apk
            boihpihing-dot-${{ github.run_number }}.apk
            boihpihing-store-${{ github.run_number }}.aab
            boihpihing-store-test-${{ github.run_number }}.apk
          fail_on_unmatched_files: false
