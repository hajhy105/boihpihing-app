name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk boihpihing-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: boihpihing-apk
          path: boihpihing-${{ github.run_number }}.apk

      - name: Publish release (direct download link for phones)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 보이흐피힝 빌드 ${{ github.run_number }}
          body: 휴대폰에서 아래 Assets의 .apk 파일을 눌러 받은 뒤 설치하세요.
          files: boihpihing-${{ github.run_number }}.apk
