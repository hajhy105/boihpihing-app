name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/classic/debug/app-classic-debug.apk boihpihing-${{ github.run_number }}.apk
          cp app/build/outputs/apk/dot/debug/app-dot-debug.apk boihpihing-dot-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: boihpihing-apk
          path: |
            boihpihing-${{ github.run_number }}.apk
            boihpihing-dot-${{ github.run_number }}.apk

      - name: Publish release (direct download link for phones)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 보이흐피힝 빌드 ${{ github.run_number }}
          body: |
            boihpihing-N.apk = 3D 버전, boihpihing-dot-N.apk = 도트 버전 (둘은 따로 설치돼요)
          files: |
            boihpihing-${{ github.run_number }}.apk
            boihpihing-dot-${{ github.run_number }}.apk
